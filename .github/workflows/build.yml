name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncursesw5-dev cmake ninja-build \
            build-essential ccache libssl-dev libffi-dev libltdl-dev

      - name: Install buildozer
        run: pip install --upgrade buildozer cython

      - name: Build APK (release)
        run: buildozer -v android release

      - name: Force APK build via gradle
        run: |
          DIST=$(ls -d .buildozer/android/platform/build-*/dists/homework)
          echo "$DIST"
          cd "$DIST"
          ./gradlew assembleRelease --no-daemon || true
          ls build/outputs/apk/release/ || true
          if ls build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/bin/homework-unsigned.apk"
          else
            cp "$DIST"/../../../../bin/*.apk "$GITHUB_WORKSPACE/bin/" 2>/dev/null || true
          fi
          ls -l "$GITHUB_WORKSPACE/bin/"

      - name: Sign APK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          BT=$(ls -d "$SDK"/build-tools/* | tail -1)
          keytool -genkeypair -v -keystore key.hw -alias hw \
            -keypass 123456 -storepass 123456 -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Homework, OU=dev, O=dev, C=RU"
          UNSIGNED=$(ls bin/*.apk | grep -i release | head -1)
          echo "found: $UNSIGNED"
          ls bin/
          "$BT/zipalign" -f 4 "$UNSIGNED" bin/hw-aligned.apk
          "$BT/apksigner" sign --ks key.hw --ks-pass pass:123456 \
            --key-pass pass:123456 --out bin/homework-release.apk bin/hw-aligned.apk
          "$BT/apksigner" verify -v bin/homework-release.apk > verify.txt
          head -12 verify.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: homework-apk
          path: bin/homework-release.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: bin/homework-release.apk
